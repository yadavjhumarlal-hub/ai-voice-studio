<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Voice Studio</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="app"><header><div><h1>🎙️ AI Voice Studio</h1><p>Natural Hindi voice generator</p></div><b>Azure F0</b></header><section class="card"><label>अपना स्क्रिप्ट लिखें</label><textarea id="text" maxlength="12000" placeholder="यहाँ अपना Hindi script लिखें..."></textarea><div class="between"><span id="count">0 / 12000</span><button id="clear">Clear</button></div></section><section class="card grid"><div><label>Voice</label><select id="voice"></select></div><div><label>Style</label><select id="style"><option>neutral</option><option>serious</option><option>excited</option><option>happy</option><option>sad</option><option>soft</option></select></div></section><section class="card"><label>Speed <span id="rv">0%</span></label><input id="rate" type="range" min="-30" max="30" value="0"><label>Pitch <span id="pv">0%</span></label><input id="pitch" type="range" min="-20" max="20" value="0"><label>Volume <span id="vv">0%</span></label><input id="volume" type="range" min="-20" max="20" value="0"></section><button id="generate">🎧 Generate Voice</button><p id="status"></p><section id="out" class="card hidden"><label>आवाज़ तैयार है</label><audio id="audio" controls></audio><a id="download" download="ai-voice.mp3">⬇️ Download MP3</a></section><footer>API key browser में नहीं आती; .env में server-side रहती है।</footer></div><script src="/static/app.js"></script></body></html>
